# Generic CI stub generated by workflow-init. One job per component — fill the commands
# and delete components you don't have. Keep this green from day one: a red-by-default
# check trains everyone to ignore it, and a claimed-but-inert check is worse than none.
name: CI

on:
  pull_request:
    branches: ["{{DEFAULT_BRANCH}}"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # {{STACK_SETUP}}  e.g. actions/setup-node / setup-python / setup-java
      - name: Build
        run: |
          {{BUILD_CMD}}
      - name: Test
        run: |
          {{TEST_CMD}}
