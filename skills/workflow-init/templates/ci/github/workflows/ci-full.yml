# Full-gate CI generated by workflow-init for a profile with testing.ci_required.
# The gate order is fixed and cheap-before-expensive on purpose: a trivial mistake
# should fail in seconds, not after the integration suite. See docs/engineering/ci.md.
#
# Fill every {{...}} with the command this repo actually runs. Delete a job the repo
# has no equivalent for — a claimed-but-inert check is worse than no check.
name: CI

on:
  pull_request:
    branches: ["{{DEFAULT_BRANCH}}"]
  push:
    branches: ["{{DEFAULT_BRANCH}}"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # {{STACK_SETUP}}
      - run: |
          {{LINT_CMD}}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # {{STACK_SETUP}}
      - run: |
          {{TYPECHECK_CMD}}

  test:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # {{STACK_SETUP}}
      - run: |
          {{TEST_CMD}}

  build:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # {{STACK_SETUP}}
      - run: |
          {{BUILD_CMD}}

  integration:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # {{STACK_SETUP}}
      - run: |
          {{INTEGRATION_CMD}}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # {{STACK_SETUP}}
      - run: |
          {{AUDIT_CMD}}

  # E2E and bundle-size are opt-in. Uncomment and fill only if this repo has them;
  # leaving an empty job here would be a green check that proves nothing.
  # e2e:
  #   needs: [integration]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: {{E2E_CMD}}
  # bundle-size:
  #   needs: [build]
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: {{BUNDLE_SIZE_CMD}}
